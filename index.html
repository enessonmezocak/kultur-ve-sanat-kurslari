<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kültür ve Sanat Kursları</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }
    body {
      background-color: transparent;
      padding: 16px;
      color: #1e293b;
    }
    .widget-container {
      max-width: 680px;
      margin: 0 auto;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
    }
    .label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      color: #475569;
      margin-bottom: 8px;
    }
    .custom-select {
      width: 100%;
      padding: 14px 16px;
      font-size: 1rem;
      font-weight: 500;
      color: #0f172a;
      background-color: #f8fafc;
      border: 1.5px solid #cbd5e1;
      border-radius: 12px;
      outline: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .custom-select:focus {
      border-color: #0d9488;
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.15);
    }
    .card-list {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .kurs-card {
      border: 1px solid #e2e8f0;
      border-left: 4px solid #0d9488;
      border-radius: 12px;
      padding: 18px 20px;
      background: #fcfdfe;
      display: flex;
      flex-direction: column;
      gap: 12px;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .kurs-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #0f172a;
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 999px;
      background: #ccfbf1;
      color: #0f766e;
    }
    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      font-size: 0.875rem;
    }
    .info-item {
      display: flex;
      flex-direction: column;
    }
    .info-label {
      font-size: 0.75rem;
      color: #64748b;
      margin-bottom: 2px;
      font-weight: 500;
    }
    .info-value {
      color: #334155;
      font-weight: 600;
    }
    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 10px;
      border-top: 1px dashed #e2e8f0;
      margin-top: 4px;
    }
    .price {
      font-size: 1.2rem;
      font-weight: 700;
      color: #0d9488;
    }
    .apply-btn {
      display: inline-block;
      background: #0d9488;
      color: #ffffff;
      text-decoration: none;
      padding: 9px 18px;
      font-size: 0.875rem;
      font-weight: 600;
      border-radius: 8px;
      transition: background 0.2s ease;
    }
    .apply-btn:hover {
      background: #0f766e;
    }
    .empty-state {
      margin-top: 20px;
      padding: 30px;
      text-align: center;
      color: #94a3b8;
      font-size: 0.95rem;
      border: 1px dashed #cbd5e1;
      border-radius: 12px;
    }
  </style>
</head>
<body>

<div class="widget-container">
  <label for="kursSecimi" class="label">İncelemek İstediğiniz Atölyeyi Seçiniz</label>
  <select id="kursSecimi" class="custom-select">
    <option value="">Atölye Seçiniz...</option>
  </select>

  <div id="sonucAlani" class="card-list">
    <div class="empty-state">Detayları ve kayıt linkini görmek için yukarıdan bir atölye belirleyin.</div>
  </div>
</div>

<script>
  const kursVerileri = [
    { ad: "Kodu Game Lab", ogretmen: "Ali Osman Demirel", sure: "14 Hafta", gun: "Salı 16:30 - 17:30", kademe: "2-3-4. Sınıflar", kontenjan: "15 Kişi", tutar: "9.625 TL", link: "https://ornek-kayit-linki.com" },
    { ad: "3 Boyutlu Tasarım", ogretmen: "Toygar Yalçın", sure: "14 Hafta", gun: "Pazartesi 16:30 - 17:30", kademe: "5-6-7. Sınıflar", kontenjan: "15 Kişi", tutar: "7.700 TL", link: "https://ornek-kayit-linki.com" },
    { ad: "3 Boyutlu Tasarım", ogretmen: "Ali Osman Demirel", sure: "14 Hafta", gun: "Pazartesi 16:30 - 17:30", kademe: "2-3-4. Sınıflar", kontenjan: "15 Kişi", tutar: "7.700 TL", link: "https://ornek-kayit-linki.com" },
    { ad: "Örgü - El İşi - Punch", ogretmen: "Zeynep Durmuş", sure: "14 Hafta", gun: "Perşembe 16:30 - 17:30", kademe: "2-3-4. Sınıflar", kontenjan: "5 - 10 Kişi", tutar: "7.700 TL", link: "https://ornek-kayit-linki.com" },
    { ad: "Matematik TYT Ön Hazırlık", ogretmen: "Selçuk Top", sure: "14 Hafta", gun: "Cuma 16:30 - 17:30", kademe: "11. Sınıflar", kontenjan: "5 - 10 Kişi", tutar: "11.550 TL", link: "https://ornek-kayit-linki.com" },
    { ad: "Akıl, Zeka ve Kağıt Kalem Oyunları", ogretmen: "Kübra Şeherli", sure: "14 Hafta", gun: "Salı 16:30 - 17:30", kademe: "İlkokul", kontenjan: "5 - 10 Kişi", tutar: "6.600 TL", link: "https://ornek-kayit-linki.com" },
    { ad: "Fransızca", ogretmen: "Başak Küçük", sure: "14 Hafta", gun: "Çarşamba 16:30 - 17:30", kademe: "İlkokul - Ortaokul", kontenjan: "5 - 10 Kişi", tutar: "8.800 TL", link: "https://ornek-kayit-linki.com" },
    { ad: "English Club", ogretmen: "Dilara Dursun", sure: "14 Hafta", gun: "Çarşamba 16:30 - 17:30", kademe: "Anaokulu - İlkokul", kontenjan: "8 - 10 Kişi", tutar: "12.320 TL", link: "https://ornek-kayit-linki.com" },
    { ad: "Ukulele", ogretmen: "Gizem Metin", sure: "14 Hafta", gun: "Salı 16:30 - 17:30", kademe: "Anaokulu - İlkokul", kontenjan: "5 - 10 Kişi", tutar: "9.625 TL", link: "https://ornek-kayit-linki.com" },
    { ad: "Flüt", ogretmen: "Gizem Metin", sure: "14 Hafta", gun: "Haftaiçi 16:30 - 17:30", kademe: "Anaokulu - İlkokul", kontenjan: "5 - 10 Kişi", tutar: "9.625 TL", link: "https://ornek-kayit-linki.com" }
  ];

  const selectEl = document.getElementById("kursSecimi");
  const sonucAlani = document.getElementById("sonucAlani");

  // Benzersiz kurs isimlerini dropdown'a doldur
  const benzersizKurslar = [...new Set(kursVerileri.map(k => k.ad))];
  benzersizKurslar.forEach(ad => {
    const opt = document.createElement("option");
    opt.value = ad;
    opt.textContent = ad;
    selectEl.appendChild(opt);
  });

  selectEl.addEventListener("change", (e) => {
    const secilen = e.target.value;
    if (!secilen) {
      sonucAlani.innerHTML = '<div class="empty-state">Detayları ve kayıt linkini görmek için yukarıdan bir atölye belirleyin.</div>';
      return;
    }

    const eslesenler = kursVerileri.filter(k => k.ad === secilen);
    sonucAlani.innerHTML = eslesenler.map(item => `
      <div class="kurs-card">
        <div class="card-header">
          <div class="kurs-title">${item.ad}</div>
          <span class="badge">${item.kademe}</span>
        </div>
        <div class="info-grid">
          <div class="info-item">
            <span class="info-label">Eğitmen</span>
            <span class="info-value">${item.ogretmen}</span>
          </div>
          <div class="info-item">
            <span class="info-label">Gün & Saat</span>
            <span class="info-value">${item.gun}</span>
          </div>
          <div class="info-item">
            <span class="info-label">Süre</span>
            <span class="info-value">${item.sure}</span>
          </div>
          <div class="info-item">
            <span class="info-label">Kontenjan</span>
            <span class="info-value">${item.kontenjan}</span>
          </div>
        </div>
        <div class="card-footer">
          <span class="price">${item.tutar}</span>
          <a href="${item.link}" target="_blank" rel="noopener noreferrer" class="apply-btn">Kursa Başvur ↗</a>
        </div>
      </div>
    `).join("");
  });
</script>

</body>
</html>
